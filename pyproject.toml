[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
markers = [
    "integration: requires running external docker services (postgres, redis, qdrant)",
    "live: requires live LLM api keys (NVIDIA or Groq)",
    "embedding: downloads and runs real embedding model",
]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
